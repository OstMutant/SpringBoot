<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta content="IE=edge" http-equiv="X-UA-Compatible">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <link data-th-href="@{/css/bootstrap.min.css}" rel="stylesheet">
  <link data-th-href="@{/css/styles.css}" rel="stylesheet"/>
  <script data-th-src="@{/js/jquery.min.js}"></script>
  <script data-th-src="@{/js/oboe-browser.min.js}"></script>
  <script data-th-src="@{/js/bootstrap.min.js}"></script>
  <script data-th-src="@{/js/popper.min.js}"></script>
  <script data-th-src="@{/js/custom/index.js}"></script>
  <script data-th-src="@{/js/custom/modal.js}"></script>
  <title>Spring Boot Application</title>
</head>
<body>
<h4>Hello, [[${name}]]!</h4>

<h4>JSON stream uses js!</h4>
<button id="triggerButton" type="button" class="btn btn-success" data-bs-toggle="modal">
  Add
</button>
<!-- Include the combined modal template -->
<div data-th-insert="fragments/modal :: modal"></div>
<br/>

<input type="text" id="startId" placeholder="Start ID">
<input type="text" id="endId" placeholder="End ID">
<button id="loadButton" class="btn btn-primary">Load</button>

<div class="table-responsive">
  <table class="table">
    <thead>
    <tr>
      <th scope="col">Id</th>
      <th scope="col">Name</th>
      <th scope="col">Created At</th>
      <th scope="col">Updated At</th>
      <th scope="col">Actions</th> <!-- Add Actions column -->
    </tr>
    </thead>
    <tbody>
    </tbody>
  </table>
</div>

<h4>Finish!</h4>
</body>
</html>
