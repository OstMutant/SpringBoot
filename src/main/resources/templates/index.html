<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta content="IE=edge" http-equiv="X-UA-Compatible">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <link data-th-href="@{/css/bootstrap.min.css}" rel="stylesheet">
  <link data-th-href="@{/css/styles.css}" rel="stylesheet"/>

  <script data-th-src="@{/js/jquery.min.js}"></script>
  <script data-th-src="@{/js/popper.min.js}"></script>
  <script data-th-src="@{/js/bootstrap.min.js}"></script>
  <script data-th-src="@{/js/oboe-browser.min.js}"></script>

  <!-- JavaScript files for User management (for Settings tab) -->
  <script data-th-src="@{/js/custom/utils.js}"></script> <!-- Corrected path for utils.js -->
  <script data-th-src="@{/js/custom/users/modal.js}"></script>
  <script data-th-src="@{/js/custom/users/user_list.js}"></script>

  <!-- NEW: JavaScript files for Advertisement management (for Main tab) -->
  <script data-th-src="@{/js/custom/advertisements/advertisement_modal.js}"></script>
  <script data-th-src="@{/js/custom/advertisements/advertisement_list.js}"></script>

  <title>Spring Boot Application</title>
</head>
<body>
<h4>Hello, [[${name}]]!</h4>

<br/>

<!-- Tab navigation -->
<ul class="nav nav-tabs" id="myTab" role="tablist">
  <li class="nav-item" role="presentation">
    <!-- 'active' class initially set for 'main-tab' by default Bootstrap behavior -->
    <button class="nav-link active" id="main-tab" data-bs-toggle="tab" data-bs-target="#main" type="button" role="tab" aria-controls="main" aria-selected="true">Main</button>
  </li>
  <li class="nav-item" role="presentation">
    <button class="nav-link" id="settings-tab" data-bs-toggle="tab" data-bs-target="#settings" type="button" role="tab" aria-controls="settings" aria-selected="false">Settings</button>
  </li>
</ul>

<!-- Tab content -->
<div class="tab-content" id="myTabContent">
  <!-- 'show active' classes initially set for 'main' tab pane by default Bootstrap behavior -->
  <div class="tab-pane fade show active" id="main" role="tabpanel" aria-labelledby="main-tab">
    <!-- Main tab content now includes Advertisement list and modal -->
    <div data-th-insert="~{fragments/main_tab_content :: mainTabContent}"></div>
  </div>
  <div class="tab-pane fade" id="settings" role="tabpanel" aria-labelledby="settings-tab">
    <!-- Settings content still includes User list and modal -->
    <div data-th-insert="~{fragments/settings_tab_content :: settingsTabContent}"></div>
  </div>
</div>

<!-- All JavaScript related to tab persistence and settings tab auto-reload removed as per simplification request -->

</body>
</html>
