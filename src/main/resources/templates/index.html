<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta content="IE=edge" http-equiv="X-UA-Compatible">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <link data-th-href="@{/css/bootstrap.min.css}" rel="stylesheet">
  <link data-th-href="@{/css/styles.css}" rel="stylesheet"/>
  <script data-th-src="@{/js/jquery.min.js}"></script>
  <script data-th-src="@{/js/oboe-browser.min.js}"></script>
  <script data-th-src="@{/js/scripts.js}"></script>
  <title>Spring Boot Application</title>
</head>
<body>
<h4>Hello, [[${name}]]!</h4>

<h4>JSON stream uses js!</h4>
<div class="mb-3">
  <label for="name" class="form-label">Enter name</label>
  <input type="text" id="name" class="form-control" placeholder="Enter name" required>
  <div id="nameError" class="invalid-feedback">Name cannot be empty.</div>
</div>
<button id="addButton" class="btn btn-success">Add</button>
<br/>
<input type="text" id="startId" placeholder="Start ID">
<input type="text" id="endId" placeholder="End ID">
<button id="loadButton" class="btn btn-primary">Load</button>

<div class="table-responsive">
  <table class="table">
    <thead>
    <tr>
      <th scope="col">Id</th>
      <th scope="col">Name</th>
      <th scope="col">Created At</th>
      <th scope="col">Updated At</th>
    </tr>
    </thead>
    <tbody>
    </tbody>
  </table>
</div>

<h4>Finish!</h4>

</body>
</html>
