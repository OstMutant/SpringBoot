<div data-th-fragment="userList">

  <!-- Add User button - now outside the filter block -->
  <div class="add-user-button-container mb-4">
    <button id="triggerButton" type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#userModal">
      Add User
    </button>
  </div>

  <!-- Combined Controls and Filter Block -->
  <div class="filter-block mb-4">
    <!-- ID Filters -->
    <div class="filter-group">
      <label for="startId" class="form-label">ID From:</label>
      <input type="number" id="startId" placeholder="Start ID" min="1" class="form-control">
    </div>
    <div class="filter-group">
      <label for="endId" class="form-label">ID To:</label>
      <input type="number" id="endId" placeholder="End ID" min="1" class="form-control">
    </div>

    <!-- Name Filter -->
    <div class="filter-group filter-group-name">
      <label for="filterName" class="form-label">Name:</label>
      <input type="text" id="filterName" placeholder="Name" class="form-control">
    </div>

    <!-- Created At Date Filters -->
    <div class="filter-group">
      <label for="filterCreatedAtStart" class="form-label">Created From:</label>
      <input type="date" id="filterCreatedAtStart" title="Created After" class="form-control">
    </div>
    <div class="filter-group">
      <label for="filterCreatedAtEnd" class="form-label">Created To:</label>
      <input type="date" id="filterCreatedAtEnd" title="Created Before" class="form-control">
    </div>

    <!-- Updated At Date Filters -->
    <div class="filter-group">
      <label for="filterUpdatedAtStart" class="form-label">Updated From:</label>
      <input type="date" id="filterUpdatedAtStart" title="Updated After" class="form-control">
    </div>
    <div class="filter-group">
      <label for="filterUpdatedAtEnd" class="form-label">Updated To:</label>
      <input type="date" id="filterUpdatedAtEnd" title="Updated Before" class="form-control">
    </div>
  </div>

  <!-- Load and Clear Filters buttons - now in a separate container -->
  <div class="filter-buttons-container mb-4">
    <button id="loadButton" class="btn btn-primary me-2">Load</button>
    <button id="clearFiltersButton" class="btn btn-secondary">Clear Filters</button>
  </div>

  <!-- Table -->
  <div class="table-responsive">
    <table class="table table-bordered table-hover">
      <thead>
      <tr>
        <th scope="col" data-sort-field="id">Id <span class="sort-icon"></span></th>
        <th scope="col" data-sort-field="name">Name <span class="sort-icon"></span></th>
        <th scope="col" data-sort-field="createdAt">Created At <span class="sort-icon"></span></th>
        <th scope="col" data-sort-field="updatedAt">Updated At <span class="sort-icon"></span></th>
        <th scope="col">Actions</th>
      </tr>
      </thead>
      <tbody id="tableBody">
      </tbody>
    </table>
  </div>

  <!-- Pagination Information -->
  <div class="pagination-info-text mt-3 mb-2">
    <span id="paginationInfo"></span>
  </div>

  <!-- Pagination -->
  <nav aria-label="Page navigation example">
    <ul class="pagination justify-content-center" id="paginationList">
    </ul>
  </nav>
</div>
